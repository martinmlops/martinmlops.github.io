# ──────────────────────────────────────────────
# 사이트 기본 정보
# ──────────────────────────────────────────────
title: "Tech Blog"
subtitle: "Azure, AWS, Kubernetes, Cloud Infrastructure<br>DevOps, Full stack Engineering"
description: "Azure, AWS, Kubernetes, Network, Security 등 클라우드 인프라 기술 블로그"
url: "https://martinmlops.github.io"
baseurl: ""
locale: "ko-KR"
timezone: Asia/Seoul

# ──────────────────────────────────────────────
# 테마 설정
# ──────────────────────────────────────────────
# 외부 테마를 쓰지 않는다. 레이아웃(_layouts)·셸(_includes)·스타일
# (_sass/custom)을 전부 직접 갖고 있어서 remote_theme /
# minimal_mistakes_skin / jekyll-remote-theme 를 제거했다.

# ──────────────────────────────────────────────
# 기능 설정
# ──────────────────────────────────────────────
# search / search_full_content 설정은 없다 — 테마 내장 lunr 검색 전용
# 값이었고, 그 테마를 제거했다. 검색은 자체 구현이다:
# _plugins/search_index.rb 가 만드는 /search-index.json +
# assets/js/search-match.js · search.js (아래 after_footer_scripts).
# search_index.rb 의 remove_theme_lunr_assets 는 테마가 복사해오던
# assets/js/lunr/* 를 걸러내던 방어 코드로, 이제 걸러낼 것이 없다.

# 수식 (MathJax)
head_scripts:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Mermaid 다이어그램 · 자체 검색 엔진
after_footer_scripts:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - /assets/js/theme-toggle.js
  - /assets/js/mermaid-init.js
  - /assets/js/contents-rail.js
  - /assets/js/search-match.js
  - /assets/js/search.js

# ──────────────────────────────────────────────
# 저자 정보
# ──────────────────────────────────────────────
author:
  name: "Martin"
  avatar: "/assets/images/profile.jpg"
  bio: "Solutions Architect"
  location: "South Korea"
  links:
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/_martlln"

# ──────────────────────────────────────────────
# 댓글 시스템 (Giscus)
# ──────────────────────────────────────────────
comments:
  provider: "giscus"
  giscus:
    repo_id: ""              # placeholder
    category_name: "Comments"
    category_id: ""          # placeholder
    discussion_term: "pathname"
    reactions_enabled: "1"
    theme: "light"
    lang: "ko"

# ──────────────────────────────────────────────
# 분석 (Google Analytics 4)
# ──────────────────────────────────────────────
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-XXXXXXXXXX"   # placeholder

# ──────────────────────────────────────────────
# 페이지네이션
# ──────────────────────────────────────────────
paginate: 10
paginate_path: /page:num/

# ──────────────────────────────────────────────
# 플러그인
# ──────────────────────────────────────────────
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate
  - jekyll-include-cache

# ──────────────────────────────────────────────
# 기본값 설정
# ──────────────────────────────────────────────
# author_profile / share / related / toc / toc_sticky 는 minimal-mistakes
# 레이아웃만 읽던 값이라 제거했다. 우리 레이아웃·인클루드 어디에서도
# 참조하지 않는다(목차는 contents-rail.js가 .post-body를 훑어 만든다).
# read_time 은 _layouts/post.html이 page.read_time을 읽으므로 남긴다.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      read_time: true
      comments: true
      show_date: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page

# ──────────────────────────────────────────────
# 카테고리/태그 아카이브
# ──────────────────────────────────────────────
# category_archive / tag_archive 는 minimal-mistakes의 liquid 아카이브
# 제너레이터 전용 키였다. /categories/ 와 /tags/ 는 _pages/categories.md ·
# _pages/tags.md 가 site.categories · site.tags 로 직접 만들므로 제거했다.

# ──────────────────────────────────────────────
# Markdown / 코드 강조
# ──────────────────────────────────────────────
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# ──────────────────────────────────────────────
# 빌드 설정
# ──────────────────────────────────────────────
include:
  - _pages

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - node_modules
  - __tests__
  - package*.json
  - README.md
  - LICENSE
