<div class="search-wrap">
  <button class="icon-btn search-toggle" type="button" aria-label="검색" aria-haspopup="dialog" aria-expanded="false" aria-controls="search-panel">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.4"/>
      <path d="M10.6 10.6L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="search-panel" id="search-panel" hidden>
    <div class="search-panel-field">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.4"/>
        <path d="M10.6 10.6L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input
        type="text"
        id="search-input"
        class="search-panel-input"
        placeholder="검색…"
        autocomplete="off"
        spellcheck="false"
        role="combobox"
        aria-autocomplete="list"
        aria-expanded="false"
        aria-controls="search-results"
        aria-label="검색어 입력">
    </div>
    <div class="search-panel-results" id="search-results" role="listbox" aria-label="검색 결과"></div>
  </div>
</div>
